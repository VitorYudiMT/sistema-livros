
services:

  # Aplicação PHP + Apache + Symfony
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: sistema_livros_app

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html

    ports:
      - "8080:80"

    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://app:app_secret@db:3306/sistema_livros?serverVersion=8.4.0&charset=utf8mb4"

    depends_on:
      db:
        condition: service_healthy


  # Banco de dados MySQL
  db:
    image: mysql:8.4

    container_name: sistema_livros_db

    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: sistema_livros
      MYSQL_USER: app
      MYSQL_PASSWORD: app_secret

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # Interface administrativa do banco
  phpmyadmin:
    image: phpmyadmin:5.2

    container_name: sistema_livros_phpmyadmin

    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 20M

    ports:
      - "8081:80"

    depends_on:
      db:
        condition: service_healthy


# Volume persistente do banco
volumes:
  mysql_data:
